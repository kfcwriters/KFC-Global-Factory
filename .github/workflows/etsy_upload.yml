name: 🛍️ Weekly Etsy Digital Product Publisher

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday 9:00 AM UTC = 2:30 PM IST
  workflow_dispatch:

jobs:
  etsy-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📥 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab>=4.0.0

      - name: 🛍️ Run Etsy Pipeline
        env:
          ETSY_API_KEY:       ${{ secrets.ETSY_API_KEY }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        run: python etsy_pipeline.py

      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etsy-failure-logs
          path: "*.log"
          retention-days: 7
