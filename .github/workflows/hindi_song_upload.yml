name: 🎵 Weekly Hindi Romantic Song Video + Short

on:
  schedule:
    # Every Wednesday at 3:30 PM UTC = 9:00 PM IST
    # (different day from English song on Saturday — avoids Kaggle quota clash)
    - cron: "30 15 * * 3"
  workflow_dispatch:

jobs:
  hindi-song-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core fonts-liberation

      - name: 📥 Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle --quiet

      - name: 🎵 Run Weekly Hindi Song Pipeline
        env:
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          KAGGLE_USERNAME:     ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:          ${{ secrets.KAGGLE_KEY }}
        run: python hindi_song_pipeline.py

      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hindi-song-failure-logs
          path: "*.log"
          retention-days: 7
