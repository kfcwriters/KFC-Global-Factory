name: 🎵 Weekly Suno Romantic Song Video + Short

on:
  schedule:
    - cron: "30 15 * * 6"
  workflow_dispatch:

jobs:
  suno-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg jq
          ffmpeg -version

      - name: 📥 Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # --- YuE generation via Hugging Face Space (free, no GPU) ---
      - name: 🎵 Generate song via YuE Gradio API
        run: python yue_generator.py

      # --- The generated audio is saved to temp_audio/output.mp3 ---
      - name: 🎵 Run Weekly Romantic Song + Short Pipeline
        env:
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          ACESTEP_AUDIO:       temp_audio/output.mp3
        run: python suno_pipeline.py

      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suno-failure-logs
          path: "*.log"
          retention-days: 7
