name: 🎵 Weekly Suno Romantic Song Video + Short

on:
  schedule:
    - cron: "30 15 * * 6"
  workflow_dispatch:

jobs:
  suno-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 Verify ffmpeg is available
        run: |
          ffmpeg -version
          echo "✅ ffmpeg is ready"

      - name: 📥 Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 🎵 Generate music with ACE-Step (15s test)
        id: acestep
        uses: audiohacking/acestep-action@main
        continue-on-error: true
        with:
          prompt: 'orchestral romantic, strings and piano'
          lyrics: |
            [Verse 1]
            My heart knows the way
            [Chorus]
            You are my light
          duration: '15'

      - name: 🎵 Run Weekly Romantic Song + Short Pipeline
        env:
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          ACESTEP_AUDIO:       ${{ runner.temp }}/acestep/output.mp3
        run: python suno_pipeline.py

      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suno-failure-logs
          path: "*.log"
          retention-days: 7
