name: 🎵 Weekly Suno Romantic Song Video + Short

on:
  schedule:
    - cron: "30 15 * * 6"
  workflow_dispatch:

jobs:
  suno-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --- FIXED: ffmpeg using git master build (reliable) ---
      - name: 🔧 Install ffmpeg (static binary)
        run: |
          wget https://johnvansickle.com/ffmpeg/builds/ffmpeg-git-amd64-static.tar.xz
          tar -xf ffmpeg-git-amd64-static.tar.xz
          sudo cp ffmpeg-git-*-static/ffmpeg /usr/local/bin/
          sudo cp ffmpeg-git-*-static/ffprobe /usr/local/bin/
          ffmpeg -version

      - name: 📥 Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # --- Generate lyrics and save to kaggle_music/lyrics.txt ---
      - name: 📝 Generate lyrics for Kaggle
        run: python prepare_kaggle.py

      # --- Push to Kaggle, wait, and download ---
      - name: 🎵 Generate Song on Kaggle Free GPU
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "📤 Pushing script to Kaggle..."
          kaggle kernels push -p kaggle_music

          echo "⏳ Waiting for Kaggle GPU to finish (about 3-5 minutes)..."
          sleep 300

          echo "📥 Downloading generated song..."
          kaggle kernels output bansalabhishek99/weekly-song-generator -p temp_audio

          echo "✅ Song downloaded to temp_audio/output.mp3"

      # --- Check Kaggle log for debugging ---
      - name: 📋 Check Kaggle log
        run: |
          echo "=== Kaggle Log ==="
          if [ -f temp_audio/weekly-song-generator.log ]; then
            cat temp_audio/weekly-song-generator.log
          else
            echo "⚠️ Log file not found"
          fi

      # --- Run the main pipeline ---
      - name: 🎵 Run Weekly Romantic Song + Short Pipeline
        env:
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          ACESTEP_AUDIO:       temp_audio/output.mp3
        run: python suno_pipeline.py

      # --- Upload logs on failure ---
      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suno-failure-logs
          path: |
            *.log
            temp_audio/*.log
          retention-days: 7
