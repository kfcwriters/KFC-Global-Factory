name: 🎵 Weekly Suno Romantic Song Video + Short

on:
  schedule:
    # Every Saturday at 3:30 PM UTC = 9:00 PM IST
    - cron: "30 15 * * 6"
  workflow_dispatch:

jobs:
  suno-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core fonts-liberation

      - name: 📥 Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # --- NEW: Generate music with ACE-Step ---
      - name: 🎵 Generate music with ACE-Step
        id: acestep
        uses: audiohacking/acestep-action@v1
        with:
          prompt: 'orchestral romantic, strings and piano, powerful female vocal'
          lyrics: |
            [Verse 1]
            My heart knows the way
            Through the darkest night
            [Chorus]
            You are my light
            Forever by my side
          duration: '210'   # 3.5 minutes (adjust as needed)
          # If you want instrumental only, uncomment the next line:
          # instrumental: true

      # The action's output file path is in ${{ runner.temp }}/acestep/output.mp3
      # We'll pass it to the Python script via environment variable.

      - name: 🎵 Run Weekly Romantic Song + Short Pipeline
        env:
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          ACESTEP_AUDIO:       ${{ runner.temp }}/acestep/output.mp3
        run: python suno_pipeline.py

      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suno-failure-logs
          path: "*.log"
          retention-days: 7
